const { useState, useEffect, useRef } = React;
const pad = n => String(n).padStart(2, "0");
const reducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- hooks ---------- */
function useReveal() {
  useEffect(() => {
    if (!("IntersectionObserver" in window) || reducedMotion()) return;
    document.documentElement.classList.add("anim");
    const io = new IntersectionObserver(entries => entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    }), { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

function useScrollState(ids) {
  const [progress, setProgress] = useState(0);
  const [active, setActive] = useState("");
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      setProgress(max > 0 ? h.scrollTop / max : 0);
      setScrolled(h.scrollTop > 40);
      let cur = "";
      ids.forEach(id => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < 160) cur = id; });
      setActive(cur);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => { window.removeEventListener("scroll", onScroll); window.removeEventListener("resize", onScroll); };
  }, []);
  return { progress, active, scrolled };
}

function CountUp({ value, suffix = "" }) {
  const ref = useRef(null);
  const [n, setN] = useState(value);
  useEffect(() => {
    if (!("IntersectionObserver" in window) || reducedMotion()) return;
    setN(0);
    const io = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return;
      io.disconnect();
      const t0 = performance.now(), dur = 1400;
      const tick = t => {
        const p = Math.min(1, (t - t0) / dur);
        setN(Math.round(value * (1 - Math.pow(1 - p, 3))));
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }, { threshold: 0.4 });
    io.observe(ref.current);
    return () => io.disconnect();
  }, [value]);
  return <span ref={ref} className="tabular-nums">{n}{suffix}</span>;
}

/* ---------- primitives ---------- */
function MonoImage({ src, alt, label, className = "", position }) {
  const [failed, setFailed] = useState(false);
  if (failed || !src) {
    return (
      <div role="img" aria-label={alt || label}
        className={`flex items-center justify-center bg-[repeating-linear-gradient(45deg,#fff_0_10px,#E5E5E5_10px_11px)] ${className}`}>
        {label && <span className="border border-black bg-white px-2 py-1 text-[10px] font-medium uppercase tracking-[0.2em]">{label}</span>}
      </div>
    );
  }
  return <img src={src} alt={alt} onError={() => setFailed(true)}
    style={position ? { objectPosition: position } : undefined} className={`mono-img object-cover ${className}`} />;
}

            <p className="max-w-lg text-base font-light leading-relaxed text-coal sm:text-lg">{h.subheadline}</p>
          </div>
          <div className="reveal mt-10 flex flex-col gap-4 sm:flex-row">
            <Button href={h.primaryCta.href}>{h.primaryCta.label}</Button>
            <Button href={h.secondaryCta.href} variant="secondary">{h.secondaryCta.label}</Button>
          </div>
        </div>
        <div className="reveal relative lg:col-span-5">
          <figure className="relative border border-black p-3 sm:p-4">
            <div className="overflow-hidden border border-black">
              <MonoImage src={h.portrait.src} alt={h.portrait.alt} label="Founder Portrait" position={h.portrait.position}
                className="aspect-[4/5] w-full transition-transform duration-[1.2s] ease-out hover:scale-[1.03]" />
            </div>
            <figcaption className="mt-3 flex justify-between text-[10px] font-medium uppercase tracking-[0.25em]">
              <span>{h.caption[0]}</span><span>{h.caption[1]}</span>
            </figcaption>
            {/* stat badge */}
            <div className="absolute -left-3 -top-5 border border-black bg-black px-5 py-4 text-white sm:-left-8">
              <p className="font-serif text-3xl font-black leading-none">{h.badge.value}</p>
              <p className="mt-1.5 text-[9px] font-medium uppercase tracking-[0.25em]">{h.badge.label}</p>
            </div>
          </figure>
          {/* vertical side label */}
          <p aria-hidden="true" className="absolute -right-9 top-1/2 hidden -translate-y-1/2 whitespace-nowrap text-[10px] font-medium uppercase tracking-[0.35em] xl:block" style={{ writingMode: "vertical-rl" }}>
            {h.sideLabel}
          </p>
        </div>
      </div>
    </section>
  );
}

function Ticker() {
  const items = [...SITE.ticker, ...SITE.ticker];
  return (
    <div className="marquee-wrap overflow-hidden border-b border-black bg-black py-4 text-white" aria-label={SITE.ticker.join(", ")}>
      <div className="marquee flex w-max" aria-hidden="true">
        {items.map((t, i) => (
          <span key={i} className="flex items-center whitespace-nowrap font-serif text-xl italic sm:text-2xl">
            <span className="px-7">{t}</span><span className="text-sm not-italic">✦</span>
          </span>
        ))}
      </div>
    </div>
  );
}

function Stats() {
  return (
    <section aria-label="At a glance" className="border-b border-black">
      <dl className="mx-auto grid max-w-7xl sm:grid-cols-3">
        {SITE.stats.map((s, i) => (
          <div key={i} className={`reveal group px-4 py-10 transition-colors duration-300 hover:bg-black hover:text-white sm:px-8 sm:py-14 ${i > 0 ? "border-t border-black sm:border-l sm:border-t-0" : ""}`}>
            <div className="flex items-start justify-between">
              <dd className="font-serif text-6xl font-black tracking-tight sm:text-7xl"><CountUp value={s.value} suffix={s.suffix} /></dd>
              <span className="font-serif text-sm italic">{pad(i + 1)}</span>
            </div>
            <dt className="mt-4 max-w-[17rem] text-[11px] font-medium uppercase leading-relaxed tracking-[0.2em] opacity-80">{s.label}</dt>
          </div>
        ))}
      </dl>
    </section>
  );
}

function Story() {
  const s = SITE.story;
  return (
    <section id="story" className="scroll-mt-16 border-b border-black">
      <div className="mx-auto grid max-w-7xl gap-12 px-4 py-20 sm:px-8 md:py-28 lg:grid-cols-12 lg:gap-16">
        <aside className="lg:col-span-5">
          <div className="lg:sticky lg:top-28">
            <SectionTitle index="01" eyebrow={s.eyebrow} heading={s.heading} />
            <ol className="reveal mt-12 border-l border-black">
              {s.timeline.map((t, i) => (
                <li key={t.place} className="relative pb-7 pl-7 last:pb-0">
                  <span className={`absolute -left-[5px] top-1.5 h-[9px] w-[9px] border border-black ${i === s.timeline.length - 1 ? "bg-white" : "bg-black"}`} />
                  <p className="text-[11px] font-semibold uppercase tracking-[0.22em]">{t.place}</p>
                  <p className="mt-1 text-sm leading-relaxed text-coal">{t.note}</p>
                </li>
              ))}
            </ol>
          </div>
        </aside>
        <div className="lg:col-span-7">
          <div className="reveal space-y-6 text-[17px] font-light leading-[1.85] text-coal">
            {s.intro.map((p, i) => (
              <p key={i} className={i === 0 ? "first-letter:float-left first-letter:mr-3 first-letter:mt-1.5 first-letter:font-serif first-letter:text-[76px] first-letter:font-black first-letter:leading-[0.75] first-letter:text-black" : ""}>{p}</p>
            ))}
          </div>
          <blockquote className="reveal my-14 border-y border-black py-10 text-center">
            <span aria-hidden="true" className="block font-serif text-6xl leading-none">“</span>
            <p className="mx-auto max-w-xl font-serif text-3xl italic leading-tight sm:text-[42px]">{s.pullQuote}</p>
          </blockquote>
          {s.chapters.map((c, i) => (
            <article key={c.title} className={`reveal ${i ? "mt-14" : ""} grid gap-4 sm:grid-cols-[72px_1fr]`}>
              <span className="outline-num font-serif text-5xl font-black leading-none sm:text-6xl">{pad(i + 1)}</span>
              <div>
                <h3 className="font-serif text-2xl font-bold leading-tight sm:text-[30px]">{c.title}</h3>
                <div className="mt-5 space-y-5 text-[17px] font-light leading-[1.85] text-coal">
                  {c.paragraphs.map((p, j) => <p key={j} className={j === c.paragraphs.length - 1 && i === s.chapters.length - 1 ? "font-serif text-2xl italic font-normal text-black" : ""}>{p}</p>)}
                </div>
              </div>
            </article>
          ))}
        </div>
      </div>
    </section>
  );
}

function Beliefs() {
  const b = SITE.beliefs;
  return (
    <section id="beliefs" className="scroll-mt-16 border-b border-black bg-black text-white">
      <div className="mx-auto max-w-7xl px-4 py-20 sm:px-8 md:py-28">
        <SectionTitle index="02" eyebrow={b.eyebrow} heading={b.heading} light className="max-w-4xl" />
        <ol className="mt-14 grid border-l border-t border-coal sm:grid-cols-2 lg:grid-cols-5">
          {b.items.map((it, i) => (
            <li key={it.title} className="reveal group flex min-h-[260px] flex-col border-b border-r border-coal p-6 transition-colors duration-300 hover:bg-white hover:text-black sm:p-7"
              style={{ transitionDelay: `${i * 60}ms` }}>
              <span className="outline-num-w font-serif text-6xl font-black leading-none group-hover:[-webkit-text-stroke:1px_#000]">{pad(i + 1)}</span>
              <div className="pt-10">
                <h3 className="font-serif text-xl font-bold leading-tight">{it.title}</h3>
                <p className="mt-3 text-sm font-light leading-relaxed opacity-80">{it.text}</p>
              </div>
            </li>
          ))}
        </ol>
      </div>
    </section>
  );
}

function VentureLogo({ v, light }) {
  const [failed, setFailed] = useState(false);
  if (failed || !v.logo) return <span className="font-serif text-xl font-black">{v.monogram}</span>;
  return <img src={v.logo} alt={`${v.name} logo`} onError={() => setFailed(true)} className={`mono-img h-full w-full object-contain p-2 ${light ? "invert" : ""}`} />;
}

function VentureCard({ item, i }) {
  const f = item.featured;
  return (
    <li className={`reveal group border p-6 transition-colors duration-300 sm:p-8 ${f ? "border-black bg-black text-white" : "border-line hover:border-black hover:bg-black hover:text-white"}`}>
      <div className="flex items-start justify-between gap-5">
        <div className="flex items-center gap-5">
          <div className={`flex h-16 w-16 shrink-0 items-center justify-center border transition-colors duration-300 ${f ? "border-white" : "border-black group-hover:border-white"}`}>
            <VentureLogo v={item} light={f} />
          </div>
          <div className="min-w-0">
            <h3 className={`font-serif font-bold leading-tight ${f ? "text-3xl sm:text-4xl" : "text-2xl"}`}>{item.name}</h3>
            {item.role && <Label className="mt-1.5 leading-relaxed opacity-80">{item.role}</Label>}
          </div>
        </div>
        <span className="font-serif text-sm italic">{pad(i + 1)}</span>
      </div>
      <p className={`mt-6 leading-relaxed opacity-90 ${f ? "text-base" : "text-sm"}`}>{item.description}</p>
      {item.services && (
        <ul className="mt-6 grid grid-cols-2 border-l border-t border-coal">
          {item.services.map(s => <li key={s} className="border-b border-r border-coal px-3 py-2.5 text-[10px] font-medium uppercase tracking-[0.18em]">{s}</li>)}
        </ul>
      )}
      <div className={`mt-7 flex flex-wrap items-center justify-between gap-4 border-t pt-5 ${f ? "border-coal" : "border-line group-hover:border-coal"}`}>
        {item.proof ? <p className="font-serif text-lg italic">{item.proof}</p> : <span />}
        <TextLink href={item.cta.href}>{item.cta.label}</TextLink>
      </div>
    </li>
  );
}

function Ventures() {
  const v = SITE.ventures;
  return (
    <div id="ventures" className="scroll-mt-16 px-4 py-20 sm:px-8 md:py-24 lg:pr-12">
      <SectionTitle index="03" eyebrow={v.eyebrow} heading={v.heading} className="mb-12" />
      <ul className="space-y-5">
        {v.items.map((item, i) => <VentureCard key={item.name} item={item} i={i} />)}
      </ul>
    </div>
  );
}

function ComingSoon() {
  const c = SITE.comingSoon;
  return (
    <div id="next" className="scroll-mt-16 border-t border-black px-4 py-20 sm:px-8 md:py-24 lg:border-t-0 lg:pl-12">
      <SectionTitle index="04" eyebrow={c.eyebrow} heading={c.heading} />
      <p className="reveal mt-5 max-w-md font-serif text-xl italic leading-snug">{c.intro}</p>
      <ul className="mt-10 border-t border-black">
        {c.items.map((a, i) => (
          <li key={a.name} className="reveal group flex items-start gap-5 border-b border-line py-8">
            <div className="relative shrink-0 overflow-hidden border border-black">
              <MonoImage src={a.thumb} alt="" className="h-24 w-24 transition-transform duration-700 group-hover:scale-105 sm:h-28 sm:w-28" />
              <span className="absolute left-0 top-0 border-b border-r border-black bg-white px-1.5 py-0.5 font-serif text-xs italic">{pad(i + 1)}</span>
            </div>
            <div className="min-w-0">
              <div className="flex flex-wrap items-center gap-2 text-[10px] font-medium uppercase tracking-[0.2em]">
                <span className="bg-black px-2 py-0.5 text-white">Coming Soon</span>
                <span className="text-coal">{a.tag}</span>
              </div>
              <h3 className="mt-3 font-serif text-xl font-bold uppercase leading-snug tracking-tight underline-offset-4 group-hover:underline sm:text-[22px]">{a.name}</h3>
              <p className="mt-2 text-sm leading-relaxed text-coal">{a.text}</p>
            </div>
          </li>
        ))}
      </ul>
      <Button href={c.cta.href} className="reveal mt-10 w-full sm:w-auto">{c.cta.label}</Button>
    </div>
  );
}

function Contact() {
  const c = SITE.contact;
  const [status, setStatus] = useState("");
  const onSubmit = e => {
    if (c.formAction) return;
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    const to = SITE.connect.email;
    if (!to) { setStatus("Thanks! Contact details are being set up — please reach out on social for now."); return; }
    const body = c.fields.map(f => `${f.label}: ${d[f.name] || ""}`).join("\n");
    window.location.href = `mailto:${to}?subject=${encodeURIComponent("New project — " + (d.name || ""))}&body=${encodeURIComponent(body)}`;
    setStatus("Opening your email app…");
  };
  const input = "peer w-full border-0 border-b border-black bg-transparent px-0 pb-3 pt-2 text-lg font-light placeholder-transparent focus:border-b-2 focus:outline-none focus:ring-0";
  return (
    <section id="contact" className="scroll-mt-16 border-t border-black">
      <div className="mx-auto max-w-7xl px-4 pt-20 sm:px-8 md:pt-28">
        <div className="reveal flex items-baseline justify-between border-b border-black pb-4">
          <Label className="font-semibold">{c.eyebrow}</Label>
          <span className="font-serif text-sm italic">§ 05</span>
        </div>
        <h2 className="reveal mt-8 max-w-5xl font-serif text-[44px] font-black uppercase leading-[0.95] tracking-[-0.02em] sm:text-7xl lg:text-[96px]">{c.heading}</h2>
      </div>
      <div className="mx-auto grid max-w-7xl gap-14 px-4 pb-20 pt-14 sm:px-8 md:pb-28 lg:grid-cols-12 lg:gap-16">
        <div className="reveal lg:col-span-5">
          <p className="text-lg font-light leading-relaxed text-coal">{c.text}</p>
          <Label className="mt-10">{c.listTitle}</Label>
          <ul className="mt-4 border-t border-black">
            {c.reasons.map((r, i) => (
              <li key={r} className="flex items-baseline gap-5 border-b border-line py-4">
                <span className="font-serif text-sm italic">{pad(i + 1)}</span>
                <span className="text-[15px]">{r}</span>
              </li>
            ))}
          </ul>
        </div>
        <div className="reveal lg:col-span-7">
          <form action={c.formAction || undefined} method="post" onSubmit={onSubmit} className="border border-black p-6 sm:p-10">
            <div className="grid gap-x-8 gap-y-9 sm:grid-cols-2">
              {c.fields.map(f => (
                <div key={f.name} className={`relative ${f.type === "textarea" || f.name === "name" ? "sm:col-span-2" : ""}`}>
                  {f.type === "textarea"
                    ? <textarea id={f.name} name={f.name} rows={4} required={f.required} placeholder={f.label} className={`${input} resize-y`} />
                    : <input id={f.name} name={f.name} type={f.type} required={f.required} placeholder={f.label} className={input} />}
                  <label htmlFor={f.name}
                    className="pointer-events-none absolute -top-4 left-0 text-[10px] font-medium uppercase tracking-[0.22em] transition-all peer-placeholder-shown:top-2.5 peer-placeholder-shown:text-sm peer-placeholder-shown:normal-case peer-placeholder-shown:tracking-normal peer-placeholder-shown:text-neutral-500 peer-focus:-top-4 peer-focus:text-[10px] peer-focus:uppercase peer-focus:tracking-[0.22em] peer-focus:text-black">
                    {f.label}
                  </label>
                </div>
              ))}
            </div>
            <button type="submit" className={`${btnBase} ${btnStyles.primary} mt-10 w-full sm:w-auto`}>{c.button}<Arrow /></button>
            {status && <p role="status" className="mt-4 text-sm">{status}</p>}
          </form>
          <p className="mt-5 text-xs leading-relaxed text-coal">
            {c.careersNote} <a href={c.careersLink.href} className="underline underline-offset-2">{c.careersLink.label}</a>.
          </p>
        </div>
      </div>
    </section>
  );
}

function ConnectBar() {
  const c = SITE.connect;
  const [done, setDone] = useState(false);
  const onSubmit = e => { if (!c.subscribeAction) { e.preventDefault(); setDone(true); } };
  // TODO: until subscribeAction is set, sign-ups are not saved anywhere
  return (
    <section id="connect" className="scroll-mt-16 border-y border-black">
      <div className="mx-auto grid max-w-7xl lg:grid-cols-12">
        <div className="reveal border-b border-black px-4 py-14 sm:px-8 lg:col-span-6 lg:border-b-0 lg:border-r">
          <Label className="font-semibold">{c.eyebrow}</Label>
          <h2 className="mt-4 font-serif text-4xl font-black uppercase tracking-tight">{c.heading}</h2>
          <p className="mt-3 max-w-md text-sm leading-relaxed text-coal">{c.text}</p>
          <ul className="mt-8 grid grid-cols-6 border-l border-t border-black sm:max-w-md">
            {c.socials.map(s => (
              <li key={s.name} className="border-b border-r border-black">
                <a href={s.href} target={s.href.startsWith("http") ? "_blank" : undefined} rel="noopener noreferrer" aria-label={s.name} title={s.name}
                  className="flex aspect-square items-center justify-center transition-colors duration-300 hover:bg-black hover:text-white">
                  <Icon name={s.icon} />
                </a>
              </li>
            ))}
          </ul>
        </div>
        <div id="notify" className="reveal scroll-mt-16 flex flex-col justify-center px-4 py-14 sm:px-8 lg:col-span-6">
          <Label className="font-semibold">{c.subscribeLabel}</Label>
          <p className="mt-3 font-serif text-2xl italic">{SITE.comingSoon.cta.label}</p>
          <form action={c.subscribeAction || undefined} method="post" onSubmit={onSubmit} className="mt-7 flex flex-col sm:flex-row">
            <label htmlFor="sub-email" className="sr-only">Email address</label>
            <input id="sub-email" name="email" type="email" required placeholder={c.subscribePlaceholder}
              className="min-w-0 flex-1 border border-black bg-white px-5 py-4 text-sm placeholder:text-neutral-500 focus:outline-none focus:ring-1 focus:ring-black sm:border-r-0" />
            <button type="submit" className={`${btnBase} ${btnStyles.primary}`}>{c.subscribeButton}</button>
          </form>
          {done && <p role="status" className="mt-4 text-sm">Thanks! Sign-ups open soon. Follow along on social in the meantime.</p>}
        </div>
      </div>
    </section>
  );
}

function Footer() {
  const f = SITE.footer;
  return (
    <footer className="overflow-hidden bg-black text-white">
      <div className="mx-auto max-w-7xl px-4 pt-14 sm:px-8">
        <div className="flex flex-col gap-6 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p className="font-serif text-xl font-bold">{f.line1}</p>
            <p className="mt-1 font-serif text-lg italic opacity-80">{f.line2}</p>
          </div>
          <a href="#top" className="group inline-flex self-start sm:self-auto items-center gap-2 border-b border-white pb-1 text-[10px] font-medium uppercase tracking-[0.25em]">
            Back to top <span aria-hidden="true" className="transition-transform group-hover:-translate-y-1">↑</span>
          </a>
        </div>
      </div>
      <p aria-hidden="true" className="select-none whitespace-nowrap text-center font-serif font-black uppercase leading-[0.8] tracking-[-0.04em]"
        style={{ fontSize: "clamp(80px, 23.5vw, 340px)", margin: "0.15em 0 0", paddingBottom: "0.12em" }}>
        {SITE.name}
      </p>
      <div className="border-t border-coal">
        <p className="mx-auto max-w-7xl px-4 py-5 text-[10px] font-medium uppercase tracking-[0.25em] opacity-80 sm:px-8">{f.copyright}</p>
      </div>
    </footer>
  );
}

function App() {
  useReveal();
  return (
    <div id="top" className="min-h-screen bg-white text-black">
      <a href="#story" className="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:bg-black focus:px-4 focus:py-2 focus:text-white">Skip to content</a>
      <Header />
      <main>
        <Hero />
        <Ticker />
        <Stats />
        <Story />
        <Beliefs />
        <section className="mx-auto grid max-w-7xl lg:grid-cols-2 lg:divide-x lg:divide-black">
          <Ventures />
          <ComingSoon />
        </section>
        <Contact />
        <ConnectBar />
      </main>
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
